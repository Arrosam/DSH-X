# 打包：推 tag（或手动触发）时在 GitHub 的机器上出安装包。
#
# 为什么要有这个：mac 的包在 Windows 上打不出来（codesign / hdiutil 都是 macOS 独有），
# 所以 Windows 和 macOS 各自跑在自己的 runner 上；另外这也是「不怕本机环境差异」的一条路。
#
# 安装包里不再有 Electron 和 Node：外壳是 launcher/ 的 Rust 二进制，Node 由外壳首次运行时
# 下载、Electron 由服务按需下载。所以两个平台都不再需要 @electron/packager / electron 这类
# 运行时 devDependencies（package.json 里已没有），npm ci 这一步也就不需要了。
#
# 只上传资产、不创建 Release：Release 连同中文发行说明仍按原来的流程在本地建，
# 建完这个 workflow 会把产物补上去（Windows 的 exe + SBOM + 清单 + 签名，mac 的 dmg）。
#
# 签名是可选的：仓库里配了 DSH_RELEASE_KEY（私钥文件内容）才会签，没配就只出清单。
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 往 Release 上传资产要这个

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 外壳用 Rust（launcher/），windows-latest 自带 Rust 工具链；先把版本打出来，
      # 工具链缺失时要红在这一步而不是打包中途。Inno Setup 由 scripts/pack.mjs 按需自动安装。
      - name: 确认 Rust 工具链
        run: cargo --version

      - name: 跑测试
        run: npm test

      - name: 写入签名私钥（没配 secret 就跳过）
        shell: bash
        env:
          KEY: ${{ secrets.DSH_RELEASE_KEY }}
        run: |
          mkdir -p release
          if [ -n "$KEY" ]; then printf '%s' "$KEY" > release/release-key.pem; echo "有私钥，本次会签名"; else echo "没有私钥，只出清单"; fi

      - name: 打包（Rust 原生外壳 + Inno Setup）
        run: npm run dist

      # 应用层增量资产由 pack.mjs 生成（app 清单/zip，有私钥就签名）；这里只做校验。
      # 清单里不再有 Electron 版本与 runtime 资产——运行时不随安装包发。
      - name: 校验应用层增量资产
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/app-manifest.mjs verify --manifest release/app-"$VERSION"-win.manifest.json --zip release/app-"$VERSION"-win.zip --sig release/app-"$VERSION"-win.manifest.json.sig

      - name: 校验清单（没配签名私钥就按「未签名」核体积与哈希）
        shell: bash
        run: |
          if [ -f release/release-key.pem ]; then node scripts/release-manifest.mjs verify
          else node scripts/release-manifest.mjs verify --unsigned-ok; fi

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Setup-windows
          path: |
            release/DSH-Setup.exe
            release/app-*-win.zip
            release/app-*-win.manifest.json
            release/app-*-win.manifest.json.sig
            release/dsh-x-*.spdx.json
            release/release-manifest.json
            release/release-manifest.sig
          if-no-files-found: error

      - name: 挂到同 tag 的 Release 上
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "还没有 $tag 的 Release，资产先留在 workflow artifacts 里；建好 Release 后再跑一次即可"
            exit 0
          fi
          # 发布页只放安装包与应用层增量资产（SBOM/发布清单留在本机自查；
          # 应用清单的签名是客户端校验用的，有签名就一并上传）
          gh release upload "$tag" release/DSH-Setup.exe release/app-*-win.zip release/app-*-win.manifest.json --clobber
          if ls release/app-*-win.manifest.json.sig >/dev/null 2>&1; then
            gh release upload "$tag" release/app-*-win.manifest.json.sig --clobber
          fi

  macos:
    strategy:
      fail-fast: false
      matrix:
        # 两个架构各自在自己的 runner 上原生编译 Rust（跨架构要另装 target，本机也验证不了）
        include:
          - runner: macos-14 # Apple Silicon
            arch: arm64
          - runner: macos-15-intel # Intel（macos-13 这个标签 GitHub 已经退役，用了会一直排队）
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      DSH_MAC_ARCH: ${{ matrix.arch }}
      # tag 构建只有在配置了固定证书时才强制签名；没配就退回 ad-hoc，
      # 否则没有证书的仓库打 tag 时 mac 两个 job 必红、dmg 出不来。
      DSH_MAC_REQUIRE_SIGNED: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.DSH_MAC_CERT_P12_BASE64 != '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 外壳用 Rust，.dmg 用 Xcode CLT（codesign / hdiutil / sips / iconutil / swift）；
      # macos runner 都自带，打出版本号，缺失时早点红。
      - name: 确认 Rust 与 Xcode 工具链
        run: |
          cargo --version
          xcode-select -p
          codesign --version

      - name: 跑测试
        run: npm test

      - name: 导入固定 macOS 签名证书
        shell: bash
        env:
          DSH_MAC_CERT_P12_BASE64: ${{ secrets.DSH_MAC_CERT_P12_BASE64 }}
          DSH_MAC_CERT_PASSWORD: ${{ secrets.DSH_MAC_CERT_PASSWORD }}
          DSH_MAC_EXPECTED_SHA1: ${{ vars.DSH_MAC_SIGNING_SHA1 }}
        run: bash scripts/setup-mac-signing.sh

      - name: 打包（Rust 原生外壳 + .app + .dmg，签名按配置）
        run: npm run dist

      # 应用层增量资产（mac 的 app 在 .app/Contents/Resources/app）。清单里没有 Electron 版本，
      # 运行时不跟着 app 更新走，由服务按需下载、单独升级。
      - name: 写入签名私钥（没配 secret 就跳过）
        shell: bash
        env:
          KEY: ${{ secrets.DSH_RELEASE_KEY }}
        run: |
          mkdir -p release
          if [ -n "$KEY" ]; then printf '%s' "$KEY" > release/release-key.pem; echo "有私钥，本次会签名"; else echo "没有私钥，只出清单"; fi

      - name: 生成并校验应用层增量资产
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/app-manifest.mjs build --app "release/DSH-X.app/Contents/Resources/app" --version "$VERSION" --platform mac --out release
          node scripts/app-manifest.mjs verify --manifest release/app-"$VERSION"-mac.manifest.json --zip release/app-"$VERSION"-mac.zip --sig release/app-"$VERSION"-mac.manifest.json.sig

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-X-mac-${{ matrix.arch }}
          # 清单/SBOM 目前只有 Windows 的 pack.mjs 会生成，mac 这边先只传 dmg 与 app 资产；
          # 两平台各写一份同名清单会互相覆盖，等清单支持多产物之后再说
          path: |
            release/DSH-X-mac-*.dmg
            release/app-*-mac.zip
            release/app-*-mac.manifest.json
            release/app-*-mac.manifest.json.sig
          if-no-files-found: error

      - name: 挂到同 tag 的 Release 上
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/DSH-X-mac-*.dmg --clobber
            # app 资产两架构内容相同，只让 arm64 传，避免两个 job 的 zip/清单/签名互相覆盖
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              gh release upload "$tag" release/app-*-mac.zip release/app-*-mac.manifest.json --clobber
              if ls release/app-*-mac.manifest.json.sig >/dev/null 2>&1; then
                gh release upload "$tag" release/app-*-mac.manifest.json.sig --clobber
              fi
            fi
          else
            echo "还没有 $tag 的 Release，dmg 先留在 workflow artifacts 里"
          fi

      - name: 清理临时签名钥匙串
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dsh-mac-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/dsh-mac-signing.keychain-db"
          fi
