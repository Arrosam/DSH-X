[package]
name = "dsh-launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DSH-Setup"
path = "installer.rs"
required-features = ["installer"]

[features]
installer = []

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true

[dependencies]
serde_json = "1"
tao = "0.37.0"
wry = "0.57.0"
